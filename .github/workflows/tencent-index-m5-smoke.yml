name: tencent-index-m5-smoke

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - '.github/workflows/tencent-index-m5-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe Tencent Shanghai index 5m history
        run: |
          pip -q install requests
          python - <<'PY'
          import requests, json
          tests=[
            ('fq_range','https://ifzq.gtimg.cn/appstock/app/fqkline/get',{'param':'sh000001,m5,2026-05-01,2026-06-30,3000,qfq'}),
            ('kline_range','https://web.ifzq.gtimg.cn/appstock/app/kline/kline',{'param':'sh000001,m5,2026-05-01,2026-06-30,3000'}),
            ('mkline_count','https://ifzq.gtimg.cn/appstock/app/kline/mkline',{'param':'sh000001,m5,,3000'}),
            ('kline_count','https://web.ifzq.gtimg.cn/appstock/app/kline/kline',{'param':'sh000001,m5,,,3000'}),
          ]
          h={'User-Agent':'Mozilla/5.0','Referer':'https://gu.qq.com/'}
          for name,url,p in tests:
              try:
                  r=requests.get(url,params=p,headers=h,timeout=15)
                  print('TEST',name,'status',r.status_code,'bytes',len(r.content),'url',r.url)
                  print(r.text[:1000].replace('\n',' '))
              except Exception as e: print('ERR',name,repr(e))
          PY
