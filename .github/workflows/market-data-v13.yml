name: market-data-v13

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - 'market_data/**'
      - '.github/workflows/market-data-v13.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'market_data/**'
      - '.github/workflows/market-data-v13.yml'
  workflow_dispatch:

jobs:
  backfill-validate-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Collect A-share and overseas 5m history
        working-directory: market_data
        run: python run_pipeline.py
      - name: Collect timestamped historical news
        working-directory: market_data
        run: python news_collector.py
        continue-on-error: true
      - name: Run strict no-lookahead V1.3 replay
        working-directory: market_data
        run: python backtest_v13_cloud.py
      - name: Upload data and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-v13-${{ github.run_id }}
          path: |
            market_data/data/
            market_data/results/
          if-no-files-found: warn
          retention-days: 14
