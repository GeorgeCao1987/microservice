name: Market Data Backfill

on:
  push:
    branches: [market-data-v13]
    paths:
      - 'market_data/**'
      - '.github/workflows/market-data-backfill.yml'
  pull_request:
    branches: [master]
    paths:
      - 'market_data/**'
      - '.github/workflows/market-data-backfill.yml'
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Collect and validate 5-minute data
        working-directory: market_data
        run: python backfill.py
      - name: Upload validated dataset
        uses: actions/upload-artifact@v4
        with:
          name: market-data-20260701-20260831
          path: market_data/output/
          retention-days: 30
